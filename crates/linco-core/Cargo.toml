[package]
name = "linco-core"
version = "1.0.6"
edition = "2021"
license = "MIT"
rust-version.workspace = true
description = "Reusable, transport-agnostic runtime core for Linco"

[dependencies]
bytes = "1"
linco-protocol = { path = "../linco-protocol" }
parking_lot = "0.12"
portable-pty = "0.8"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
