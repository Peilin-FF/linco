[package]
name = "linco"
version = "0.3.0"
description = "Linco — 直接驱动 Claude Code / Codex 等 CLI agent 的桌面应用"
authors = ["Linco"]
edition = "2021"

[lib]
name = "linco_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
base64 = "0.22"
tauri-plugin-dialog = "2.7.1"
regex = "1"
tiny_http = "0.12"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
# 跨平台进程信息(纯 Rust,不 spawn 子进程)。用于 Windows 本地 agent 后台任务探测,
# 避免 ps/lsof 不存在 + 每次轮询闪黑窗。Mac/Linux 仍走原 ps/lsof 路径。
sysinfo = "0.39"
tauri-plugin-clipboard-manager = "2.3.2"
# 拖出(从 app 拖文件到 Finder/资源管理器):本地文件原生拖拽。Mac/Windows 都支持。
tauri-plugin-drag = "2"
# 删除走系统垃圾篓(macOS 废纸篓 / Windows 回收站),误删可还原,不永久抹除。
trash = "5"
