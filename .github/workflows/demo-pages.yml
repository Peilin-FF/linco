name: Product demo

on:
  push:
    branches: [main]
    paths: ['demo/**', 'src/**', 'package*.json', 'vite.config.ts', '.github/workflows/demo-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run demo:build
      - name: Check public hosting setup
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' | grep -qx workflow; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Enable Settings > Pages > GitHub Actions, then rerun this workflow to publish the demo.'
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: node_modules/.cache/linco-site

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
