name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M 系列) — 独立 DMG
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          # Intel Mac — 独立 DMG
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          # Windows x64 — .msi + .exe(NSIS)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包签名(仓库已配 secrets)。
          # 不配 Apple 证书:走 ad-hoc 签名,mac 包用户首次打开需右键→打开
          # 或 `xattr -cr`。配了空的 APPLE_* 反而会让 tauri-action 尝试
          # 导入空证书而失败,故这里完全不传。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Linco ${{ github.ref_name }}
          releaseBody: |
            本次更新
            - 管理历史对话窗口：对话框左侧新增「历史对话」面板,按项目列出该 agent 存的历史会话,可点击恢复继续聊,支持单条删除与批量删除,防止会话堆积。
            - 解决 Windows 用户无法配置的问题：修复 Windows 上「无法定位 HOME」导致选完 agent/语言后安装失败,现已兼容 USERPROFILE;引导窗口新增「稍后配置」可随时跳过。
            - 添加模型连通性测试:在「设置 → 模型设置」里可一键测试所选模型/供应商是否连通。
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
