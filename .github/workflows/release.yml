name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M 系列) — 独立 DMG
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          # Intel Mac — 独立 DMG
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          # Windows x64 — .msi + .exe(NSIS)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包签名(仓库已配 secrets)。
          # 不配 Apple 证书:走 ad-hoc 签名,mac 包用户首次打开需右键→打开
          # 或 `xattr -cr`。配了空的 APPLE_* 反而会让 tauri-action 尝试
          # 导入空证书而失败,故这里完全不传。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Linco ${{ github.ref_name }}
          releaseBody: |
            Linco 1.0.3:
            - Add Standard and Project-aware LaTeX polish modes with individually reviewable edits.
            - Improve the Overleaf-style LaTeX source, rich-text, PDF, diagnostics, and file workflows.
            - Speed up PowerPoint Live drawing with batched operations, throttled previews, and safer state publishing.
            - Improve remote RPC file, preview, diff, terminal, and Windows behavior.
            - Show the updater control only when a new Linco version is available.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

  # 构建后清理:只保留 3 个安装包 + latest.json + 2 个 mac 更新 tar.gz。
  # 删掉 msi 与全部 .sig(签名已内嵌进 latest.json,独立文件无用),
  # 并把 latest.json 的 Windows 更新入口从 msi 改指向 exe。
  cleanup:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Prune redundant assets + fix latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          # 1) 拉下 latest.json,把 windows 更新入口改成 nsis exe,删冗余变体键
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --output latest.json --clobber
          python3 - <<'PY'
          import json
          d=json.load(open('latest.json'))
          p=d['platforms']
          if 'windows-x86_64-nsis' in p:
              nsis=p['windows-x86_64-nsis']
              p['windows-x86_64']={'signature':nsis['signature'],'url':nsis['url']}
          p.pop('windows-x86_64-msi',None)
          p.pop('darwin-x86_64-app',None)
          p.pop('darwin-aarch64-app',None)
          json.dump(d,open('latest.json','w'),indent=2,ensure_ascii=False)
          PY
          # 2) 替换 latest.json(先删后传,避免覆盖缓存)
          gh release delete-asset "$TAG" latest.json --yes --repo "$GITHUB_REPOSITORY" || true
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY"
          # 3) 删除 msi + 所有 .sig(逐个尝试,不存在则忽略)
          for f in \
            "Linco_${TAG#v}_x64_en-US.msi" \
            "Linco_${TAG#v}_x64_en-US.msi.sig" \
            "Linco_${TAG#v}_x64-setup.exe.sig" \
            "Linco_aarch64.app.tar.gz.sig" \
            "Linco_x64.app.tar.gz.sig"; do
            gh release delete-asset "$TAG" "$f" --yes --repo "$GITHUB_REPOSITORY" || true
          done
          echo "cleanup done; remaining assets:"
          gh release view "$TAG" --json assets -q '.assets[].name' --repo "$GITHUB_REPOSITORY"
