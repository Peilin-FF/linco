name: Native CI

on:
  push:
    branches:
      - main
      - native-iphone-rc
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CADDY_VERSION: 2.11.4
      CADDY_SHA512: 8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require aligned native versions
        shell: bash
        run: |
          set -euo pipefail

          app_version="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' ios/Config/Base.xcconfig)"
          build_number="$(sed -nE 's/^[[:space:]]*CURRENT_PROJECT_VERSION[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' ios/Config/Base.xcconfig)"
          [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$build_number" =~ ^[1-9][0-9]*$ ]]

          manifests=(
            apps/linco-server/Cargo.toml
            crates/linco-core/Cargo.toml
            crates/linco-protocol/Cargo.toml
          )
          for manifest in "${manifests[@]}"; do
            package_version="$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' "$manifest" | head -n 1)"
            if [[ "$package_version" != "$app_version" ]]; then
              echo "::error file=${manifest}::package version ${package_version:-<missing>} does not match iOS MARKETING_VERSION $app_version"
              exit 1
            fi
          done

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$app_version" ]]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match native version v$app_version"
            exit 1
          fi

          echo "Validated native version $app_version (iOS build $build_number)."

      - name: Validate systemd user unit
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0755 "$HOME/.local/bin" "$HOME/.config/linco-server"
          install -m 0755 /bin/true "$HOME/.local/bin/linco-server"
          install -m 0600 deploy/linco-server.env.example "$HOME/.config/linco-server/env"
          systemd-analyze --user verify deploy/linco-server.service

      - name: Validate pinned Caddy configuration
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/caddy.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --retry-all-errors \
            --output "$archive" \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          echo "${CADDY_SHA512}  ${archive}" | shasum -a 512 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" caddy
          "$RUNNER_TEMP/caddy" adapt --config deploy/Caddyfile --adapter caddyfile --validate >/dev/null

  rust:
    name: Rust workspace
    needs: release-metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust 1.85 with lint components
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: . -> target

      - name: Check formatting
        run: cargo +1.85.0 fmt --all -- --check

      - name: Lint all targets
        run: cargo +1.85.0 clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test workspace
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/linco-rust-tests.log"
          set +e
          timeout --signal=TERM --kill-after=30s 10m \
            cargo +1.85.0 test --workspace --all-targets --all-features --locked -- --nocapture \
            2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          if (( status != 0 )); then
            python3 - "$log" "$status" <<'PY'
          from pathlib import Path
          import re
          import sys

          lines = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()
          ansi = re.compile(r"\x1b\[[0-9;]*m")
          lines = [ansi.sub("", line) for line in lines]
          status = int(sys.argv[2])
          selected = lines[-80:]
          prefix = "Rust tests exceeded the 10 minute diagnostic limit.\n" if status == 124 else ""
          message = prefix + "\n".join(line[:1000] for line in selected)
          escaped = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Rust workspace tests failed::{escaped}")
          PY
            exit "$status"
          fi

      - name: Build release daemon
        run: cargo +1.85.0 build --release -p linco-server --locked

  ios:
    name: Native iOS
    needs: release-metadata
    runs-on: macos-15
    timeout-minutes: 45
    env:
      XCODEGEN_VERSION: 2.45.4
      XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Select an App Store eligible Apple toolchain
        shell: bash
        run: |
          set -euo pipefail

          xcode_app="$(python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = []
          for path in Path("/Applications").glob("Xcode_*.app"):
              match = re.fullmatch(r"Xcode_(\d+(?:\.\d+)*)\.app", path.name)
              if not match:
                  continue
              version = tuple(int(part) for part in match.group(1).split("."))
              if version[0] >= 26:
                  candidates.append((version, str(path)))
          if candidates:
              print(max(candidates)[1])
          PY
          )"
          if [[ -z "$xcode_app" ]]; then
            echo "::error::The runner does not contain Xcode 26 or newer."
            exit 1
          fi
          sudo xcode-select --switch "$xcode_app/Contents/Developer"

          xcode_version="$(xcodebuild -version | awk '/^Xcode / { print $2; exit }')"
          ios_sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          xcode_major="${xcode_version%%.*}"
          ios_sdk_major="${ios_sdk_version%%.*}"
          if (( xcode_major < 26 || ios_sdk_major < 26 )); then
            echo "::error::App Store builds require Xcode 26+ and the iOS 26+ SDK; found Xcode $xcode_version / iOS SDK $ios_sdk_version."
            exit 1
          fi

          xcodebuild -version
          swift --version
          echo "Using iOS SDK $ios_sdk_version."

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          destination="$RUNNER_TEMP/xcodegen-dist"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --retry-all-errors \
            --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum -a 256 --check
          ditto -x -k "$archive" "$destination"
          echo "$destination/xcodegen/bin" >> "$GITHUB_PATH"
          "$destination/xcodegen/bin/xcodegen" --version | grep -F "$XCODEGEN_VERSION"

      - name: Test LincoCore
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/linco-core-test.log"
          set +e
          swift test --package-path ios/Packages/LincoCore --parallel 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          if (( status != 0 )); then
            python3 - "$log" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()
          diagnostic_indexes = [
              index
              for index, line in enumerate(lines)
              if any(marker in line.lower() for marker in (
                  "error:",
                  "fatal error",
                  "expectation failed",
                  "issue recorded",
              ))
          ]
          selected_indexes = []
          for index in diagnostic_indexes:
              selected_indexes.extend(range(max(0, index - 3), min(len(lines), index + 2)))
          selected_indexes = list(dict.fromkeys(selected_indexes))[-60:]
          selected = [lines[index] for index in selected_indexes] if selected_indexes else lines[-30:]
          message = "\n".join(line[:1000] for line in selected)
          escaped = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=LincoCore test failed::{escaped}")
          PY
            exit "$status"
          fi

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Install verified Swift package lock
        run: bash ios/Scripts/install-package-lock.sh

      - name: Resolve only locked Swift packages
        run: >-
          xcodebuild
          -project ios/Linco.xcodeproj
          -scheme Linco
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/LincoSourcePackages"
          -disableAutomaticPackageResolution
          -onlyUsePackageVersionsFromResolvedFile
          -resolvePackageDependencies

      - name: Select an available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="$(python3 - <<'PY'
          import json
          import subprocess

          payload = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"],
                  text=True,
              )
          )
          runtimes = [
              key
              for key in payload.get("devices", {})
              if key.startswith("com.apple.CoreSimulator.SimRuntime.iOS-")
          ]
          for runtime in sorted(runtimes, reverse=True):
              for device in payload["devices"][runtime]:
                  if device.get("isAvailable", True) and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator is installed on the runner")
          PY
          )"
          echo "IOS_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_udid" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_udid" -b

      - name: Build iPhone app without code signing
        run: >-
          xcodebuild
          -project ios/Linco.xcodeproj
          -scheme Linco
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/LincoDerivedData"
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/LincoSourcePackages"
          -disableAutomaticPackageResolution
          -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=
          COMPILER_INDEX_STORE_ENABLE=NO
          build

      - name: Build Release app for the iPhone device SDK
        run: >-
          xcodebuild
          -project ios/Linco.xcodeproj
          -scheme Linco
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/LincoReleaseDerivedData"
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/LincoSourcePackages"
          -disableAutomaticPackageResolution
          -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=
          COMPILER_INDEX_STORE_ENABLE=NO
          build

      - name: Run iPhone unit and UI tests
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/linco-iphone-tests.log"
          result_bundle="$RUNNER_TEMP/LincoTests.xcresult"
          result_summary="$RUNNER_TEMP/LincoTests-summary.json"
          rm -rf "$result_bundle"
          set +e
          xcodebuild \
            -project ios/Linco.xcodeproj \
            -scheme Linco \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_UDID}" \
            -derivedDataPath "$RUNNER_TEMP/LincoDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/LincoSourcePackages" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -parallel-testing-enabled NO \
            -resultBundlePath "$result_bundle" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            COMPILER_INDEX_STORE_ENABLE=NO \
            test 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          if (( status != 0 )); then
            xcrun xcresulttool get test-results summary \
              --path "$result_bundle" \
              --compact > "$result_summary" 2>/dev/null || true
            python3 - "$log" "$result_summary" <<'PY'
          from pathlib import Path
          import json
          import re
          import sys

          log_lines = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()
          ansi = re.compile(r"\x1b\[[0-9;]*m")
          log_lines = [ansi.sub("", line) for line in log_lines]
          markers = (
              "error:",
              "failed",
              "failure",
              "assertion",
              "xctassert",
              "testing failed",
              "test case",
              "test suite",
          )
          indexes = [
              index
              for index, line in enumerate(log_lines)
              if any(marker in line.lower() for marker in markers)
          ]
          selected_indexes = []
          for index in indexes:
              selected_indexes.extend(range(max(0, index - 3), min(len(log_lines), index + 4)))
          selected_indexes = list(dict.fromkeys(selected_indexes))[-50:]
          selected_lines = (
              [log_lines[index] for index in selected_indexes]
              if selected_indexes
              else log_lines[-50:]
          )

          summary_path = Path(sys.argv[2])
          summary = ""
          if summary_path.exists() and summary_path.stat().st_size:
              raw_summary = summary_path.read_text(encoding="utf-8", errors="replace")
              try:
                  summary = json.dumps(json.loads(raw_summary), indent=2, ensure_ascii=False)
              except json.JSONDecodeError:
                  summary = raw_summary
          sections = []
          if summary:
              sections.append("xcresult summary:\n" + summary[-24_000:])
          sections.append("xcodebuild diagnostics:\n" + "\n".join(line[:1000] for line in selected_lines))
          message = "\n\n".join(sections)
          escaped = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=iPhone tests failed::{escaped}")
          PY
            exit "$status"
          fi
