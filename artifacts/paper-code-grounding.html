  "html": "<div class=\"eyebrow\">Linco &#183; paper workflow assessment &#183; 10 September 2026</div><h1>The feature works. It just cannot span two machines.</h1><p class=\"lede\">The assistant already walks your repository, ranks files against the passage you are editing, pulls them over SSH and quotes them with fingerprints. None of that is missing. What is missing is the ability to say that the paper is here and the code is over there, and that is precisely the arrangement you work in.</p><div class=\"summary-band\"><div><span class=\"k\">Diagnosis</span>One active connection drives everything</div><div><span class=\"k\">Today</span>Move the paper to the server and it works</div><div><span class=\"k\">Proper fix</span>Let evidence name its own machine</div><div><span class=\"k\">Tree state</span>Typecheck clean, 372 tests pass</div></div>"

  "html": "<h2>Why it feels disconnected</h2><p>Linco holds exactly one active connection. The working directory is chosen by whether that connection is set: remote if it is, local if it is not. Every panel, including the writing assistant&#8217;s evidence gathering, is handed that single pair. So the manuscript and the experiment code are always assumed to live on the same machine.</p><p>You clone Overleaf projects to Windows and write there, while your experiments sit on the server. That puts them on opposite sides of a boundary the system has no way to describe, and the assistant ends up searching your Windows disk for code that is not on it. It then answers from the prose alone, which is exactly the ill-suited advice you describe.</p><svg viewBox=\"0 0 900 300\" width=\"100%\" role=\"img\" aria-label=\"Two modes: everything on the server works, paper local with code remote does not\">\n<defs>\n<marker id=\"ah\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"var(--olive)\"/></marker>\n<marker id=\"ahc\" markerWidth=\"9\" markerHeight=\"9\" refX=\"8\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L8,3 z\" fill=\"var(--clay)\"/></marker>\n</defs>\n<text x=\"14\" y=\"20\" font-family=\"ui-monospace,monospace\" font-size=\"11\" fill=\"var(--olive)\">MODE A &#8212; CONNECTION ACTIVE, PAPER ON THE SERVER &#183; WORKS TODAY</text>\n<rect x=\"14\" y=\"30\" width=\"250\" height=\"96\" rx=\"10\" fill=\"var(--paper)\" stroke=\"var(--g300)\" stroke-width=\"1.5\"/>\n<text x=\"30\" y=\"52\" font-family=\"ui-monospace,monospace\" font-size=\"10\" fill=\"var(--g500)\">WINDOWS</text>\n<text x=\"30\" y=\"76\" font-family=\"Georgia,serif\" font-size=\"14\" fill=\"var(--slate)\">Editor, bundled TeX</text>\n<text x=\"30\" y=\"98\" font-family=\"ui-monospace,monospace\" font-size=\"10\" fill=\"var(--g500)\">compiles the snapshot locally</text>\n<text x=\"30\" y=\"116\" font-family=\"ui-monospace,monospace\" font-size=\"1   "html": "<h2>What to do this week</h2><div class=\"callout rec\"><div class=\"callout-h\">Put the manuscript on the server</div><p>Clone the Overleaf project into the same tree as your experiment repositories, keep the connection active, and point the research repository field at the experiment directory. The assistant then discovers and reads your code the way it was designed to, and compilation still happens on Windows against the bundled TeX, so you gain the context without needing anything installed over there.</p><p>This costs one clone and changes no code. It is worth doing before building anything, because it tells you whether repository grounding actually improves your revisions or whether the retrieval quality below is the real limit.</p></div><p class=\"note\">Your own audit of that server flagged a missing TeX toolchain. That no longer blocks anything: remote papers are snapshotted and compiled locally, and the build is recorded as local execution.</p>"

  "html": "<h2>What stays broken in either mode</h2><div class=\"grid col-2\"><div class=\"card\"><div class=\"eyebrow\">Gap 1</div><h3>Results and logs are filtered out</h3><p>Automatic discovery skips output, checkpoint and experiment-tracking directories. Logs and notebooks are never eligible at all. Tables and metrics arrive only if you name them by hand, one to sixteen files at a time.</p><p>For a paper whose contribution is measured, that excludes most of the evidence that matters. The code that could have produced a number is admitted; the file holding the number is not.</p></div><div class=\"card\"><div class=\"eyebrow\">Gap 2</div><h3>Review runs blind</h3><p>Checking a whole section against the project is the request you will make most, and it is the one path that sends zero repository context by default. It offers a consistency verdict with nothing to be consistent with.</p></div><div class=\"card\"><div class=\"eyebrow\">Gap 3</div><h3>Relevance is decided before reading</h3><p>Files are picked by keyword overlap with the passage, then frozen. The assistant cannot follow a call, open the module underneath, or check what a configuration value actually is. One guess, made without reading anything.</p></div><div class=\"card\"><div class=\"eyebrow\">Gap 4</div><h3>Numbers have no origin</h3><p>Nothing records which file or run produced any figure in your tables, so a stale number is indistinguishable from a fresh one. A stale copy of your method section is sitting beside the live one right now, about twice its length.</p></div></div>"

  "html": "<h2>Two things you will hit anyway</h2><div class=\"grid col-2\"><div class=\"card\"><h3>Position sync is built but never read</h3><p>Compilation already emits and archives the file that maps source lines to positions in the PDF, and nothing consumes it. Jumping between a sentence and its place in the PDF is nearly free from here and would be felt on every revision pass.</p></div><div class=\"card\"><h3>Shell escape is off, deliberately and permanently</h3><p>Builds run without shell escape and ignore project build configuration. Overleaf projects that depend on syntax-highlighted listings, build-time vector conversion or externalized diagrams will not compile. Better to know before importing one.</p></div></div>"
