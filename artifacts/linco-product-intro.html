    "html": "<h2 id=\"preview\">① 预览界面 · 所见即所得的协作画布</h2><div class=\"callout rec\"><div class=\"callout-h\">一句话</div><p>不再“写代码 → 切窗口 → 刷新看效果”。在 <b>HTML Notebook</b> 里，你提需求、加交互，Code Agent <b>当场改、当场渲染</b>——像和一位坐在你旁边的工程师结对。</p></div><div class=\"grid col-3\"><div class=\"card\"><h3>双向编辑</h3><p>同一份产物，cell 既能你手动双击改，也能交给 Claude Code / Codex 改，两条路汇入一处，永不打架。</p><p><span class=\"badge info\">手动 cell</span> <span class=\"badge info\">Agent 编辑</span></p></div><div class=\"card\"><h3>需求即交互</h3><p>一句“加个可拖拽重排的卡片”，Agent 就把交互逻辑直接写进 HTML 产物，立刻可点可拖。</p><p><span class=\"badge new\">自然语言</span> <span class=\"badge new\">实时渲染</span></p></div><div class=\"card\"><h3>本地预览服务</h3><p>内置 HTTP 预览 + 热刷新，<code>iframe</code> 即时回显，无需手动起服务；产物自包含，随处可独立打开。</p><p><span class=\"badge warn\">热刷新</span> <span class=\"badge warn\">自包含</span></p></div></div>",

    "html": "<h2 id=\"terminal\">② 终端界面 · Agent 后台进程的显示器</h2><div class=\"callout rec\"><div class=\"callout-h\">一句话</div><p>你能开自己的终端；更关键的是，Code Agent 在后台偷偷拉起的 <b>shell、子进程、subagent</b>，全部从“盲盒”里被点亮——再也不用猜 Agent 在后台干了什么。</p></div><div class=\"grid col-2\"><div class=\"card\"><h3>多会话真实终端</h3><p>基于 <code>xterm.js</code> + 真实 PTY，随手开多个标签。和你平时的终端行为完全一致，TUI 兼容性强。</p></div><div class=\"card\"><h3>后台进程可视化</h3><p>沿 <code>ppid</code> 向下 BFS 收集 Agent 进程子树，列出每个后代的命令、PID、运行时长、CPU、内存、状态。构建、装依赖、dev server 全都暴露在阳光下。</p></div></div><div class=\"callout rec\"><div class=\"callout-h\">本地 / 远程同构</div><p>远端走常驻 Agent 的 <code>ps</code>，本地直接解析进程表，体验完全一致；连接波动时还有断线重连覆盖层自动恢复会话，不丢上下文。</p></div>",

    "html": "<h2 id=\"cluster\">④ 强大的集群管理 · 毫秒级远程窗口渲染</h2><div class=\"callout rec\"><div class=\"callout-h\">一句话</div><p>采用持久连接上的 <b>RPC 与集群通讯</b>，把远程目录、文件、终端、Agent 全程拉进毫秒级联动——<b>算力在远端，也可以极速渲染</b></p></div><div class=\"grid col-3\"><div class=\"card\"><h3>持久 RPC 通道</h3><p>传统远程开发每个操作都要新起连接、来回握手。Linco 借鉴 VS Code Remote 的“远端常驻 + RPC”，在一条持久连接里跑常驻进程，消除反复建连的往返延迟。</p><p><span class=\"badge info\">常驻进程</span> <span class=\"badge info\">低延迟</span></p></div><div class=\"card\"><h3>多 Lane 隔离</h3><p>文件树、编辑器、预览各占独立 RPC lane，互不抢占、互不阻塞，高频操作下响应依旧稳定。</p><p><span class=\"badge new\">通道隔离</span> <span class=\"badge new\">高并发</span></p></div><div class=\"card\"><h3>优雅回退</h3><p>RPC 不可用时自动回退到 shell，稳定不掉链；远端文件 / 终端 / Shadow Diff 与本地体验同构。</p><p><span class=\"badge warn\">自动回退</span> <span class=\"badge warn\">远程同构</span></p></div></div><div class=\"callout rec\"><div class=\"callout-h\">设计目标</div><p>它不是“远程桌面”，而是“<b>本地 UI + 远端执行环境</b>”：本地保持原生界面与预览服务器，远端承担 Agent、训练、文件与 Git 操作。</p></div>",
