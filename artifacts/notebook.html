<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">

<title>Notebook</title>
<link rel="stylesheet" href="/__assets/notebook.css">
<link rel="stylesheet" href="/__assets/katex.min.css">
</head>
<body>
<div class="page">
  <div class="toolbar">
    <button class="btn primary" id="save">保存到文件</button>
    <button class="btn ghost sm" id="copy">复制 Markdown</button>
    <span class="hint" id="hint">cell 双击编辑 · Shift+↵ 完成 · Ctrl+S 保存 · 拖 ⠿ 重排 · cell 间双击插入</span>
  </div>
  <div id="nb"></div>
</div>

<!-- ▼▼▼ 产物的全部内容只在这里（SEED）。引擎在插件里，不占这个文件。 ▼▼▼ -->
<script id="seed" type="application/json">

    "type": "html",

  },
  {
    "type": "html",
    "html": "<h2>1. 基础排版</h2><p>普通段落,行内 <code>code</code>、<strong>加粗</strong>、<a href=\"#\">链接</a>。下面是引用与代码块:</p><blockquote>这是 blockquote 引用。</blockquote><pre><code>def hello():\n    return 1  # pre 代码块</code></pre>"
  },
  {
    "type": "html",
    "html": "<h2>2. eyebrow / lede / tag</h2><div class=\"eyebrow\">EYEBROW 眉标</div><p class=\"lede\">lede 大号导语段落。</p><span class=\"tag\">TAG 标签</span>"
  },
  {
    "type": "html",
    "html": "<h2>3. badge / chip(配色)</h2><p><span class=\"badge\">默认</span> <span class=\"badge new\">NEW</span> <span class=\"badge add\">ADD</span> <span class=\"badge del\">DEL</span> <span class=\"badge warn\">WARN</span> <span class=\"badge info\">INFO</span></p><p><span class=\"chip ok\">chip ok</span> <span class=\"chip bad\">chip bad</span> <span class=\"chip warn\">chip warn</span> <span class=\"chip info\">chip info</span></p>"

  {
    "type": "html",

  },
  {
    "type": "html",
    "html": "<h2>5. stat-grid 指标卡</h2><div class=\"stat-grid\"><div class=\"stat-card\"><div class=\"stat-num\">128</div><div class=\"stat-label\">PASSED</div><div class=\"stat-delta up\">+12</div></div><div class=\"stat-card\"><div class=\"stat-num\">7</div><div class=\"stat-label\">FAILED</div><div class=\"stat-delta down\">-3</div></div><div class=\"stat-card\"><div class=\"stat-num\">94%</div><div class=\"stat-label\">COVERAGE</div></div></div>"
  },
  {
    "type": "html",
    "html": "<h2>6. pro / con 双栏</h2><div class=\"procon\"><div class=\"pros\"><b>优点</b><ul><li>实现简单</li><li>无新依赖</li></ul></div><div class=\"cons\"><b>缺点</b><ul><li>耦合稍高</li><li>需补测试</li></ul></div></div>"
  },
  {
    "type": "html",
    "html": "<h2>7. grid 网格(col-3)</h2><div class=\"grid col-3\"><div class=\"card\">A</div><div class=\"card\">B</div><div class=\"card\">C</div></div>"

  {
    "type": "html",

  {

    "html": "<h2>9. toc 锚点药丸</h2><div class=\"toc\"><a href=\"#a\">概述</a><a href=\"#b\">设计</a><a href=\"#c\">实现</a><a href=\"#d\">验证</a></div>"
  },
  {
    "type": "html",
    "html": "<h2>10. details 折叠</h2><details><summary>点我展开</summary><p>折叠内容:clay 三角,展开后显示。</p></details>"
  },
  {
    "type": "html",
    "html": "<h2>11. file-diff(PR 文件 diff 卡)</h2><div class=\"file-diff\"><div class=\"fd-head\"><span class=\"fd-path\">src/auth.ts</span><span class=\"fd-stat\"><span class=\"a\">+12</span> <span class=\"d\">-3</span></span></div><pre class=\"diff\"><span class=\"dl hunk\">@@ -10,7 +10,9 @@ function login()</span><span class=\"dl ctx\">const u = getUser()</span><span class=\"dl del\">return u.token</span><span class=\"dl add\">if (!u) throw new Error()</span><span class=\"dl add\">return u.token</span></pre></div>"
  },
  {
    "type": "html",

  },
  {
    "type": "html",
    "html": "<h2>13. summary-band 概要带</h2><div class=\"summary-band\"><div><span class=\"k\">状态</span>进行中</div><div><span class=\"k\">负责人</span>张三</div><div><span class=\"k\">截止</span>6/30</div><div><span class=\"k\">风险</span><span class=\"risk-dot med\"></span>中</div></div>"

  {

  {
    "type": "html",

  {
    "type": "table",
    "head": [
      "组件",
      "用途",
      "状态"
    ],
    "rows": [
      [
        "file-diff",
        "PR 文件改动",
        "✓"
      ],
      [
        "timeline",
        "时间线",
        "✓"
      ],
      [
        "stat-card",
        "指标",
        "✓"

    "type": "md",
    "text": "## 我的需求\n\n帮我对比一下 REST 和 GraphQL,该选哪个?"

  {
    "type": "html",
    "html": "<div class=\"answer\"><p>看你的场景,简述如下,结论见底部。</p><div class=\"procon\"><div class=\"pros\"><b>GraphQL</b><ul><li>按需取字段</li><li>单端点</li></ul></div><div class=\"cons\"><b>REST</b><ul><li>缓存简单</li><li>生态成熟</li></ul></div></div><div class=\"callout rec\"><div class=\"callout-h\">建议</div>多端、字段多变选 GraphQL;简单 CRUD 选 REST。</div></div>"
  }
]
</script>
