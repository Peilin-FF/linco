    "html": "<h2 id=\"in\">① 拖入:Mac/Windows 桌面 → app 内文件夹</h2><p>Tauri2 默认拦截 OS 文件拖放,通过 <code>onDragDropEvent</code> 投递<b>真实绝对路径 + 光标坐标</b>(这同时会屏蔽 OS 文件的 HTML5 拖放事件,所以必须用这条原生通道,不能用 <code>onDrop</code> 读 OS 文件)。</p><div class=\"grid col-2\"><div class=\"card\"><b>命中测试</b><p>拖放落点是屏幕坐标。给文件树每个目录行加 <code>data-drop-dir=\"&lt;path&gt;\"</code> + <code>data-drop-host=\"&lt;host&gt;\"</code>,<code>onDragDropEvent</code> 的 drop 阶段用 <code>document.elementFromPoint(x,y)</code> 命中最近的可投放目录,拿到目标 <code>(path, host)</code>。</p></div><div class=\"card\"><b>悬停高亮</b><p>drag 的 <code>over</code> 阶段同样命中,给目标行加高亮类,松手时清除 —— 复用文件树现有内部拖拽的视觉。</p></div></div><div class=\"callout\">与现有 <b>FileTree 内部拖拽</b>(<code>text/linco-path</code> + <code>onMove</code>,DOM→DOM 移动文件)<b>互不冲突</b>:内部移动走 HTML5 dataTransfer,OS 拖入走原生 onDragDropEvent,两条独立通道。落点目标即 app 当前的 <code>host</code>(本地 null / 远程别名):本地→本地用现成 <code>fs_copy</code>;本地→远程触发上传引擎。</div>",

    "html": "<h2 id=\"engine\">③ 并行传输引擎(FileZilla 式)</h2><p>新建 <code>src-tauri/src/transfer.rs</code>。一次传输 = 一个 <b>job</b>(唯一 id),job 下若干 <b>文件项</b>,由 <b>worker 池</b>并发处理。</p><div class=\"grid col-2\"><div class=\"card\"><b>展开 + 分发</b><p>目录先递归展开成文件清单(本地用 walkdir;远程用一条 <code>find -type f -printf</code> 列举 + 大小)。文件项进队列,<code>N</code> 个 worker(默认 4,可配)并发取项传输。</p></div><div class=\"card\"><b>每个 worker</b><p>上传:<code>scp -o BatchMode=yes [ssh_opts] 本地 host:远程</code>。下载:<code>scp host:远程 本地</code>。类 Unix 上自动复用 ControlMaster socket(瞬时);Windows 上各自密钥认证。worker 之间天然并行 = 多路并发。</p></div></div><div class=\"card\"><b>进度采集</b><p>scp 自带进度输出不易解析、跨平台不稳。改为<b>按\"已完成文件数 / 总数 + 已传字节 / 总字节\"</b>聚合:每个文件项完成即 <code>+1</code> 并累加其大小,job 维度算百分比 —— 简单、跨平台稳定、够用。大单文件可选解析 scp 的 stderr 百分比作二级进度(增强项,非必须)。</p></div><div class=\"callout\">复用现有 <code>remote::ssh_opts()</code> 拼 <code>-e/-o</code> 透传;命令一律过 <code>proc_ext::no_window</code>(Windows 不闪窗)+ <code>resolve_exe</code> 思路定位 scp(Windows 在 <code>C:\\Windows\\System32\\OpenSSH\\</code>)。整个 job 在 <code>blocking::run</code> 线程跑,通过 <code>AppHandle.emit</code> 推进度,<b>不阻塞 UI</b>。</div>",
