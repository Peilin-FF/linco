    "html": "<h2>④-详解 并行引擎到底怎么跑的</h2><p class=\"lede\">一句话:<b>一次拖拽 = 一个 job</b>。job 不直接「传一个目录」,而是先把目录<b>拍扁成一张文件清单</b>,再丢进一个队列,让 8 个 worker 线程像 8 条流水线一样各自抢文件传 —— 这就是 FileZilla 那种「多个文件同时飞」的体感。源码在 <code>src-tauri/src/transfer.rs</code>。</p><div class=\"grid col-2\"><div class=\"card\"><b>第 1 步 · 扫描展开(scanning)</b><p>先发一个 <code>phase:\"scanning\"</code> 事件让进度坞立刻弹出来(哪怕还没开始传)。<br>• <b>上传</b>:<code>expand_local()</code> 用 Rust 递归 <code>walk_local</code> 走本地目录,每个文件记下 <code>(本地源路径, 远端目标路径, 字节数)</code>。<br>• <b>下载</b>:<code>expand_remote()</code> 在远端跑一条 <code>find &lt;目录&gt; -type f -printf '%s\\t%p\\n'</code>,<b>一次往返</b>就把所有文件的大小+路径拿回来,不用一个个 stat。<br>展开完就知道了<b>总文件数</b>和<b>总字节数</b> —— 进度条的分母由此而来。</p></div><div class=\"card\"><b>第 2 步 · 预建目录</b><p>清扫出所有目标文件的<b>父目录</b>去重后批量创建,避免 8 个 worker 同时去 mkdir 撞车:<br>• 上传:远端 <code>mkdir -p</code>,每批最多 80 个目录拼一条命令(<code>MKDIR_CHUNK</code>),防止命令行过长。<br>• 下载:本地 <code>fs::create_dir_all</code>。<br>目录先建好,后面 worker 就只管纯传文件,互不依赖。</p></div></div><div class=\"card\" style=\"margin-top:14px\"><b>第 3 步 · worker 池并发(transferring)</b><p>清单全部塞进一个加锁队列 <code>VecDeque&lt;Item&gt;</code>,然后 spawn <code>min(8, 文件数)</code> 个线程。每个线程是同一个循环:</p><div class=\"code-panel\">loop {<br>&nbsp;&nbsp;if 取消标志 { break }&nbsp;&nbsp;&nbsp;// ← 取消在这里生效<br>&nbsp;&nbsp;let item = queue.lock().pop_front();&nbsp;// 抢一个文件<br>&nbsp;&nbsp;if item.is_none() { break }&nbsp;&nbsp;&nbsp;// 队列空 = 收工<br>&nbsp;&nbsp;emit 当前文件名;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;// 推一次进度<br>&nbsp;&nbsp;scp_one(item);&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;// 真正传这一个文件<br>&nbsp;&nbsp;shared.done += 1; bytes_done += size;&nbsp;// 累加到共享计数<br>&nbsp;&nbsp;emit 进度;<br>}</div><p style=\"margin-top:8px\">没有「给 worker 分配区间」这种事 —— 谁传完手头的就回来 <code>pop_front</code> 抢下一个,<b>天然负载均衡</b>:小文件传得快的线程会自动多干活,不会因为某个线程分到一堆大文件而卡住。<code>done / bytes_done / current / errors</code> 四个值放在一把锁保护的 <code>Shared</code> 里,任何 worker 完成一个文件就更新并 emit,前端进度条因此平滑推进。主线程 <code>join</code> 等所有 worker 退出后做汇总。</p></div><div class=\"grid col-2\" style=\"margin-top:14px\"><div class=\"card\"><b>单文件怎么传 · scp_one</b><p>每个文件就是一条 <code>scp -o BatchMode=yes -p</code> 命令(<code>-p</code> 保留时间/权限位,<code>BatchMode</code> 保证<b>绝不弹密码交互</b>,失败就失败)。上传是 <code>scp 本地路径 host:远端路径</code>,下载反过来。<br><b>关键坑(已踩平)</b>:OpenSSH 9+ 默认走 SFTP 协议,远端路径<b>不经远端 shell 解析</b>,所以这里<b>故意不能加单引号</b> —— 加了引号反而被当成文件名里的字面字符,报 No such file。这跟前面 <code>find</code>/<code>mkdir</code> 走 shell 必须 <code>shq()</code> 引号正好相反,两套规则不要混。</p></div><div class=\"card\"><b>为什么并行能更快 · 认证复用</b><p>8 条 scp 各自要连一次 SSH,握手不便宜。所以:<br>• <b>类 Unix</b>:复用 <code>ssh_opts()</code> 里的 <b>ControlMaster socket</b> —— 第一条连接建好后,其余 7 条直接搭便车,握手几乎瞬时。<br>• <b>Windows</b>:没有 ControlMaster,每个 worker 各自用密钥认证(和 FileZilla 一样),靠并发数把延迟摊薄。<br>这就是为什么大目录、多小文件场景,并行比单条 scp 串行<b>明显快</b>:瓶颈从「往返延迟 × 文件数」变成「带宽 ÷ 8 路」。</p></div></div><div class=\"callout\"><b>进度坞(前端)在监听什么</b>:整个过程后端只 emit 两种事件 —— <code>transfer-progress {jobId, phase, done, total, bytesDone, bytesTotal, current}</code> 一路推进度条/计数/当前文件名;<code>transfer-done {jobId, ok, error, total}</code> 收尾。坞里每个 job 一行,× 按钮调 <code>transfer_cancel(jobId)</code> 把取消标志置位 —— 注意它是<b>「下一个文件前」生效</b>:正在传的那个文件会传完,不会硬中断,所以不会留下半个损坏文件。全部完成自动收起(成功 2.5s,有错留 8s 给你看报错)。</p></div><div class=\"callout olive\"><b>失败是「逐文件」而非「全有全无」</b>:某个文件 scp 失败,worker 不会停,而是把 <code>文件名: 错误</code> 记进 <code>errors</code> 继续抢下一个。最后汇总时,只要 errors 非空就报告失败,但最多展示前 5 条 + 「等 N 个」,既不刷屏也不丢信息。取消则单独标 <code>已取消</code>。</p></div>",
