[
  {"type":"html","html":"<div class='eyebrow'>产品架构评估 · 2026-07-22</div><h1>Linco 无头 Linux + 手机端：可行，而且值得做</h1><p class='lede'>推荐形态不是“把桌面窗口远程投到手机”，而是让远程 Linux 上常驻一个 <code>linco-server</code>，手机通过 PWA 连接；二维码只负责首次安全配对。桌面版、网页版和未来原生手机端共用一套 React UI 与能力协议。</p><div class='callout rec'><div class='callout-h'>推荐结论</div><p><b>第一版采用 PWA + Tailscale Serve + 单用户配对。</b> 服务器直接运行在做实验的 Linux 机器上，所以本地电脑可以关机；对话、终端、文件、Git、预览和任务监控都发生在远程机。原生 iOS/Android 壳和公网中继放到后续，而不是阻塞 MVP。</p></div><div class='stat-grid'><div class='stat-card'><div class='stat-num'>89</div><div class='stat-label'>Rust Tauri commands</div></div><div class='stat-card'><div class='stat-num'>91</div><div class='stat-label'>frontend invoke calls</div></div><div class='stat-card'><div class='stat-num'>20</div><div class='stat-label'>Tauri-bound UI files</div></div><div class='stat-card'><div class='stat-num'>1</div><div class='stat-label'>shared React client</div></div></div>"},
  {"type":"html","html":"<h2 id='answer'>先回答你的核心问题</h2><div class='grid col-3'><div class='card'><span class='badge add'>可以</span><h3>电脑关机也能继续</h3><p>只要远程 Linux 服务器在线，Linco daemon、AI CLI 和实验进程就继续运行。手机只是控制端，不依赖家里的电脑做 SSH 跳板。</p></div><div class='card'><span class='badge info'>二维码</span><h3>二维码是配对，不是网络</h3><p>二维码携带服务地址和一次性短效密钥。真正的数据通道是 HTTPS/WSS；首次配对后手机保存设备凭据，可随时重新连接。</p></div><div class='card'><span class='badge new'>更优路径</span><h3>先 PWA，后原生 App</h3><p>手机浏览器“添加到主屏幕”即可获得接近 App 的体验，并复用现有 React 前端。验证体验后再用 Tauri 2 包 iOS/Android 壳。</p></div></div><div class='callout olive'><div class='callout-h'>需求已有强验证</div><p><a href='https://github.com/tiann/hapi' target='_blank' rel='noopener'>HAPI</a> 已实现远端 Hub、PWA、二维码、Codex/Claude、终端与受限工作区；<a href='https://github.com/happier-dev/happier' target='_blank' rel='noopener'>Happier</a> 已验证 daemon + relay + 多端 + E2EE；<a href='https://github.com/Ark0N/Codeman' target='_blank' rel='noopener'>Codeman</a> 已验证手机优化终端、tmux 持久会话和单次二维码。Linco 的机会是把这些成熟模式与自己的 Notebook 预览、shadow diff、任务监控整合起来。</p></div>"},
  {"type":"table","head":["当前区域","代码证据","为什么不能直接无头化","需要的改造"],"rows":[["前后端通信","前端约 91 处 invoke；Rust 约 89 个 #[tauri::command]；20 个前端文件直接依赖 Tauri API","浏览器/PWA 没有 Tauri IPC","增加统一 LincoTransport；保留 TauriTransport，新增 WebTransport"],["对话与终端","src-tauri/src/terminal.rs:35 的 TerminalState 在桌面进程内；TerminalView.tsx:497–519 卸载会 kill PTY","关掉桌面应用即丢失宿主进程与 PTY","会话所有权迁入 daemon；UI 只 attach/detach"],["预览","preview.rs:77 只监听 127.0.0.1:0；ScreenView.tsx 直接 iframe 本机回环地址","手机的 127.0.0.1 是手机自己，不是服务器","由 daemon 提供受保护的 preview gateway 和热刷新事件"],["远程访问","现有 remote.rs 是桌面端主动 SSH 到服务器，并部署 Python RPC agent","本地电脑仍是控制中心，关机后链路消失","server mode 在目标 Linux 本机直接执行；SSH 仅保留给桌面兼容模式"],["界面布局","tauri.conf.json 的桌面窗口最小宽度 900；当前是桌面多栏布局","手机上会拥挤，软键盘和触摸交互差","新增 mobile shell：底部导航、sheet、44px 点击区、键盘工具条"],["密钥配置","config.rs 将 API key / GitHub token 明文保存并随完整 AppConfig 返回前端","可信 WebView 可接受的边界不适用于远程浏览器","拆 public config 与 secret store；浏览器只得到 hasKey，不得得到密钥明文"],["安全边界","tauri.conf.json 当前 csp 为 null；本地预览默认可信环境","联网后任意 API、终端和生成 HTML 都等价于远程代码执行入口","默认 loopback、TLS、设备认证、Origin 校验、工作区根目录与预览隔离"]]},
  {"type":"html","html":"<h2 id='architecture'>推荐架构</h2><p class='lede'>核心原则：把“能力”从 Tauri 窗口中抽出来，把“传输”做成可替换适配器。这样不是维护两套 Linco，而是同一套 UI、同一套业务服务、两种连接方式。</p><div class='card'><svg viewBox='0 0 1040 510' role='img' aria-label='Linco server architecture diagram'><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#D97757'/></marker></defs><rect x='24' y='32' width='220' height='108' rx='14' fill='#FFFFFF' stroke='#D1CFC5' stroke-width='2'/><text x='134' y='70' text-anchor='middle' font-size='19' fill='#141413'>手机 / 平板</text><text x='134' y='99' text-anchor='middle' font-size='15' fill='#3D3D3A'>PWA · 后续 Tauri Mobile</text><text x='134' y='123' text-anchor='middle' font-size='13' fill='#788C5D'>React 共享界面</text><rect x='300' y='32' width='220' height='108' rx='14' fill='#F0EEE6' stroke='#D1CFC5' stroke-width='2'/><text x='410' y='70' text-anchor='middle' font-size='19' fill='#141413'>安全接入层</text><text x='410' y='99' text-anchor='middle' font-size='15' fill='#3D3D3A'>Tailscale Serve · HTTPS/WSS</text><text x='410' y='123' text-anchor='middle' font-size='13' fill='#B85C3E'>QR 仅用于首次配对</text><rect x='576' y='20' width='440' height='470' rx='18' fill='#FAF9F5' stroke='#788C5D' stroke-width='2'/><text x='796' y='56' text-anchor='middle' font-size='22' fill='#141413'>远程 Linux：linco-server</text><rect x='610' y='82' width='372' height='70' rx='12' fill='#FFFFFF' stroke='#D97757' stroke-width='2'/><text x='796' y='111' text-anchor='middle' font-size='17' fill='#141413'>HTTP API + WebSocket Event Bus</text><text x='796' y='136' text-anchor='middle' font-size='13' fill='#3D3D3A'>版本化协议 · 鉴权 · 重连 · 背压</text><rect x='610' y='178' width='174' height='100' rx='12' fill='#FFFFFF' stroke='#D1CFC5' stroke-width='2'/><text x='697' y='209' text-anchor='middle' font-size='16' fill='#141413'>Session Manager</text><text x='697' y='235' text-anchor='middle' font-size='13' fill='#3D3D3A'>PTY / tmux / agent</text><text x='697' y='258' text-anchor='middle' font-size='13' fill='#788C5D'>断线不退出</text><rect x='808' y='178' width='174' height='100' rx='12' fill='#FFFFFF' stroke='#D1CFC5' stroke-width='2'/><text x='895' y='209' text-anchor='middle' font-size='16' fill='#141413'>Workspace</text><text x='895' y='235' text-anchor='middle' font-size='13' fill='#3D3D3A'>Files · Git · Search</text><text x='895' y='258' text-anchor='middle' font-size='13' fill='#3D3D3A'>Watch · Shadow</text><rect x='610' y='304' width='174' height='100' rx='12' fill='#FFFFFF' stroke='#D1CFC5' stroke-width='2'/><text x='697' y='335' text-anchor='middle' font-size='16' fill='#141413'>Preview Gateway</text><text x='697' y='361' text-anchor='middle' font-size='13' fill='#3D3D3A'>Notebook assets</text><text x='697' y='384' text-anchor='middle' font-size='13' fill='#B85C3E'>隔离生成 HTML</text><rect x='808' y='304' width='174' height='100' rx='12' fill='#FFFFFF' stroke='#D1CFC5' stroke-width='2'/><text x='895' y='335' text-anchor='middle' font-size='16' fill='#141413'>State Store</text><text x='895' y='361' text-anchor='middle' font-size='13' fill='#3D3D3A'>SQLite · event log</text><text x='895' y='384' text-anchor='middle' font-size='13' fill='#3D3D3A'>devices · sessions</text><line x1='244' y1='86' x2='294' y2='86' stroke='#D97757' stroke-width='3' marker-end='url(#arrow)'/><line x1='520' y1='86' x2='570' y2='86' stroke='#D97757' stroke-width='3' marker-end='url(#arrow)'/><line x1='796' y1='152' x2='796' y2='170' stroke='#D97757' stroke-width='3' marker-end='url(#arrow)'/><line x1='796' y1='278' x2='796' y2='296' stroke='#D97757' stroke-width='3' marker-end='url(#arrow)'/><text x='270' y='72' text-anchor='middle' font-size='12' fill='#87867F'>WSS</text><text x='548' y='72' text-anchor='middle' font-size='12' fill='#87867F'>loopback proxy</text></svg></div><div class='grid col-2'><div class='card'><h3>桌面仍然复用</h3><p>桌面 Tauri 走 <code>TauriTransport</code>，现有调用保持低延迟；桌面也可以选择连接远端 <code>linco-server</code>，不再必须由本机 SSH 编排所有能力。</p></div><div class='card'><h3>手机不运行 AI</h3><p>手机只渲染状态、发送操作和接收事件。模型凭据、代码、PTY 和实验进程都留在 Linux 服务端，退出浏览器不会终止任务。</p></div></div>"},
  {"type":"html","html":"<h3>前端的关键抽象</h3><div class='file-diff'><div class='fd-head'><span class='fd-path'>src/lib/platform/transport.ts（建议新增）</span><span class='fd-stat'><span class='a'>一处切换全部能力</span></span></div><pre><code>export interface LincoTransport {\n  invoke&lt;T&gt;(command: string, args?: unknown): Promise&lt;T&gt;\n  listen&lt;T&gt;(event: string, handler: (payload: T) =&gt; void): Promise&lt;() =&gt; void&gt;\n}\n\n// desktop: @tauri-apps/api/core + event\n// web/PWA:  typed HTTPS calls + WebSocket('/api/v1/events')</code></pre></div><p class='note'>不要在 91 个调用点逐个写“如果是浏览器就 fetch”。先集中所有 Tauri import，再由适配器选择传输；这是整个改造能否长期维护的分水岭。这里的字符串接口只是前端兼容层；网络端必须是显式 allowlist、逐消息 schema 与 capability 校验，绝不能把任意 <code>invoke(method,args)</code> 或 shell 字符串公开成通用远程入口。</p>"},
  {"type":"table","head":["方案","本地电脑可关机","Linco 全能力","手机体验","安全/运维复杂度","建议"],"rows":[["Linco Server + PWA + Tailscale","是","可完整覆盖","高：可专门做移动布局","低到中；私有 tailnet + 应用配对","首选，先做"],["Linco Server + 原生 App + 公网 Relay","是","可完整覆盖","最高；推送/生物识别更自然","高；账号、密钥、E2EE、relay、商店发布","第二阶段"],["直接使用 HAPI / Happier","是（装在远程 Linux）","AI/终端/文件/Git 很强，但缺 Linco Notebook 预览等差异能力","已可用","取决于其 relay 或自托管","今天的临时方案 + 重点参考"],["code-server / OpenVSCode Server","是","通用 IDE 完整，但不是 Linco 工作流","平板尚可，手机偏重","成熟；仍需 TLS/认证","备用工作台"],["noVNC / 远程桌面投屏","是","理论上能看到桌面版","差：小屏、延迟、键盘手势","中；额外桌面环境与图像流","不建议做产品路线"]]},
  {"type":"html","html":"<h2 id='pairing'>二维码配对：推荐的安全流程</h2><div class='timeline'><div class='tl-entry'><div class='tl-time'>1 · 发起</div><div class='tl-body'><b>在 Linux 终端运行 <code>linco pair</code></b>。daemon 生成 256-bit 随机密钥，60–120 秒有效，并显示 ASCII QR；不是常驻密码。</div></div><div class='tl-entry'><div class='tl-time'>2 · 扫码</div><div class='tl-body'>二维码形如 <code>https://node.tailnet.ts.net/pair#PAIR_SECRET</code>，并绑定 daemon 公钥指纹。密钥放在 URL fragment；浏览器首次 GET 不会把 fragment 发给服务器或放进 Referer。</div></div><div class='tl-entry'><div class='tl-time'>3 · 绑定</div><div class='tl-body'>PWA 在本机生成设备凭据（MVP 可用服务端 session；稳定版优先 WebAuthn/passkey），通过 HTTPS 提交一次性密钥和设备公钥。服务器原子消费密钥，重复使用立即失败。</div></div><div class='tl-entry'><div class='tl-time'>4 · 双端确认</div><div class='tl-body'>手机与终端显示同一个由握手 transcript 导出的短匹配码；终端同时显示设备名/指纹，用户确认后才签发 <code>HttpOnly + Secure + SameSite=Strict</code> 会话，防止抢先扫码或扫错服务器。</div></div><div class='tl-entry'><div class='tl-time'>5 · 管理</div><div class='tl-body'><code>linco device list</code> 查看最后活动时间；<code>linco device revoke &lt;id&gt;</code> 单独撤销，<code>revoke --all</code> 紧急清空。</div></div></div><div class='callout rec'><div class='callout-h'>Tailscale-first 的价值</div><p><a href='https://tailscale.com/docs/features/tailscale-serve' target='_blank' rel='noopener'>Tailscale Serve</a> 能把只监听 <code>127.0.0.1</code> 的服务以 tailnet 内 HTTPS 暴露，并受 tailnet ACL 控制。二维码因此只在已加入私网的设备间使用。仍保留 Linco 自己的设备认证，避免“tailnet 里任何设备都可执行终端”。后端只有在自身仅监听 loopback、请求必经 Serve 时才可信任其身份头；<b>不要用公网 Funnel 做第一版。</b></p></div>"},
  {"type":"table","head":["安全不变量","必须满足的实现/测试"],"rows":[["服务默认不可公网访问","默认仅 bind 127.0.0.1；0.0.0.0 必须显式危险确认；生产只接受 HTTPS/WSS"],["二维码不可成为长期 bearer token","256-bit、短 TTL、单次原子消费、双端匹配码；秘密放 fragment；服务器日志、错误与分析事件绝不记录秘密"],["WebSocket 不能只靠 cookie","握手校验 Origin 精确白名单 + 一次性 ws ticket；消息级权限；撤销后主动断开；限制消息/连接/速率、心跳和背压"],["路径不能越界","启动时声明一个或多个 workspace root；统一安全 resolver；测试 ../、绝对路径、symlink escape 与 TOCTOU"],["终端权限单独建模","原始 PTY 输入等价 SSH/RCE；daemon 以专用非 root 用户运行，禁用 Docker socket，必要时容器化；可单独关闭 Terminal capability"],["密钥永不下发 Web 客户端","API/Git/SSH 凭据只留服务端 secret store；RPC 只返回 hasKey/lastUpdated；日志与事件也必须脱敏"],["生成的 HTML 不可信","preview 与主 API 分源或放入无同源权限的 sandbox；Notebook 保存使用仅限单文件、短效 capability，而非主会话 cookie"],["输入操作不可重复","每个写操作带 idempotency key；重连只重放事件，不重发已确认的 prompt、commit、terminal input"],["可审计但不泄密","记录设备、命令类别、工作区、时间和结果；不记录模型密钥、配对密钥、session cookie 或完整对话正文"]]},
  {"type":"html","html":"<div class='review blocking'><div class='avatar'>!</div><div class='bubble'><div class='who'>最容易被忽略的风险：预览</div><p>AI 生成的 HTML 可以包含任意 JavaScript。当前本地模式下 <code>csp: null</code> 且预览由回环服务器提供；若把它原样搬到联网服务并与 API 同源，恶意或被提示注入的 artifact 可能借用户会话读取文件、发终端命令。远程版必须把预览视为不可信内容，单独做 origin/sandbox/capability 设计。</p></div></div><div class='procon'><div class='pros'><h3>安全的预览做法</h3><ul><li>预览使用独立 origin 或 opaque sandbox</li><li>只读静态资源默认无 cookie</li><li>Notebook 保存走父页面 broker 或单文件短效 capability</li><li>开发端口代理需显式开启与逐端口授权</li></ul></div><div class='cons'><h3>不要这样做</h3><ul><li>把当前 127.0.0.1 server 直接改成 0.0.0.0</li><li>让 preview iframe 带主站管理 cookie</li><li>允许 artifact 任意调用 fs/terminal API</li><li>默认代理远程机所有监听端口</li></ul></div></div>"},
  {"type":"html","html":"<h2 id='sessions'>会话必须由 daemon 拥有</h2><div class='grid col-3'><div class='card'><h3>Detach ≠ Kill</h3><p>浏览器关闭、手机锁屏或网络切换只移除订阅者；PTY/agent 继续运行。显式“停止会话”才发送信号。</p></div><div class='card'><h3>可重放事件</h3><p>每个 session 输出带递增 <code>seq</code>。客户端重连携带最后确认序号，daemon 从有界 ring buffer 或 SQLite event log 补齐缺口。</p></div><div class='card'><h3>进程级恢复</h3><p>MVP 保证 UI 断线不丢；Beta 用 tmux 或 provider 原生 resume 元数据，使 daemon 重启后也能重新挂载或恢复会话。</p></div></div><div class='callout olive'><div class='callout-h'>对话体验分两层交付</div><p><b>第一层先实现现有能力等价：</b>xterm.js 远程附着 PTY，最快覆盖 Claude/Codex 与任意 CLI。<b>第二层做手机原生化交互：</b>AgentAdapter 将消息、权限请求、计划选择、状态和工具调用转成结构化卡片；终端仍作为完整兜底。这与 HAPI/Happier 的实践一致，也避免一开始绑定单一 AI 厂商。</p></div>"},
  {"type":"html","html":"<h2 id='roadmap'>建议实施路线</h2><div class='timeline'><div class='tl-entry'><div class='tl-time'>Phase 0</div><div class='tl-body'><b>协议切缝与可行性尖刺。</b>新增 LincoTransport；把 terminal、fs、preview 三条链路先同时跑通 Tauri 与 localhost Web transport；同时拆出 public config 与 secret store。此阶段不追求手机 UI，但要证明同一前端可双宿主。</div></div><div class='tl-entry'><div class='tl-time'>Phase 1</div><div class='tl-body'><b>可用的远程 MVP。</b>linco-server、加固的 systemd user service、Tailscale Serve 指引、终端二维码配对、设备撤销、PWA、移动导航；完成对话/终端/文件/基础预览。</div></div><div class='tl-entry'><div class='tl-time'>Phase 2</div><div class='tl-body'><b>Linco 功能等价。</b>Git、搜索、传输、热刷新、Notebook 保存、shadow diff、任务监控、历史会话；断线重连与事件补发。</div></div><div class='tl-entry'><div class='tl-time'>Phase 3</div><div class='tl-body'><b>安全 Beta。</b>预览隔离、路径与 symlink 测试、Origin/CSRF/WS 压测、审计、备份恢复、升级迁移；两种移动尺寸 E2E 测试。</div></div><div class='tl-entry'><div class='tl-time'>Phase 4</div><div class='tl-body'><b>可选产品化。</b>Tauri Mobile 原生壳、系统推送、生物识别/WebAuthn、多机列表；若确有“不装 Tailscale”的需求，再引入双向主动出站 relay + Noise 类应用层 E2EE。仅有 TLS 不代表 relay 看不到终端/文件；若宣称 relay 零知识，客户端代码也不能每次由不可信 relay 动态下发。</div></div></div>"},
  {"type":"table","head":["阶段","粗略单人工作量","出口条件","暂不包含"],"rows":[["Phase 0：transport spike","约 4–7 个工程日","桌面原功能不回退；浏览器能启动 PTY、读文件、打开一个 Notebook 预览","完整安全与移动视觉"],["Phase 1：远程 MVP","约 2–3 周","服务器无桌面环境运行；扫码配对；手机断线后 agent 继续；核心三视图可用","全 Git/搜索/传输、原生 App"],["Phase 2：功能等价","约 2–3 周","当前 chat/terminal/preview/files/git 与关键辅助能力都有远程验收用例","公网 relay、多用户"],["Phase 3：安全 Beta","约 1–2 周","威胁测试、移动 E2E、升级/恢复、预览隔离全部过闸","商店发布"],["Phase 4：原生与 relay","额外约 4–8+ 周","推送、设备密钥、relay E2EE、iOS/Android 发布链稳定","团队/企业权限体系"]]},
  {"type":"html","html":"<h3>MVP 验收不是“页面能打开”，而是这些场景都成立</h3><div class='grid col-2'><div class='card'><h3>功能闸门</h3><ul><li>Windows/Mac 桌面版仍可本地与 SSH 工作</li><li>Linux 无 GUI、桌面客户端关闭时可从手机新建/继续 AI 会话</li><li>浏览器断网 60 秒后重连，不丢输出、不重复发送输入</li><li>文件 CRUD、Git diff/stage/commit、Notebook 预览与热刷新可用</li><li>后台实验日志和任务状态能在手机查看</li></ul></div><div class='card'><h3>安全与体验闸门</h3><ul><li>过期/复用二维码均失败，撤销设备立即断开 WebSocket</li><li>恶意 Origin、无 token、超大 WS 消息和速率攻击被拒绝</li><li>路径穿越和 symlink escape 测试全过</li><li>生成 HTML 无法读取主站 cookie 或调用管理 API</li><li>390×844 与 768×1024 下触控目标、软键盘、横竖屏均可操作</li></ul></div></div>"},
  {"type":"html","html":"<h2 id='research'>GitHub / 官方技术调研：该借什么</h2><p>下面只列对 Linco 架构有直接价值的一手项目与官方文档；“借鉴”是模式级复用，不等于把别人的大工程嵌进 Linco。</p>"},
  {"type":"table","head":["项目","已验证的能力","Linco 借鉴点","边界 / 许可"],"rows":[["HAPI","单机 Hub + SQLite + runner；PWA/二维码；Codex/Claude；REST + SSE/Socket.IO；远程工作区","最接近本需求：Linux 常驻、扫码、手机新建会话、workspace roots；可直接作为产品对标","AGPL-3.0：可研究协议与交互，直接复制代码需接受网络服务开源义务"],["Happier","Machine Daemon + Relay + Web/原生端；E2EE；会话切换；文件/Git/终端","后续多机、relay、端到端加密、消息队列与 device/server profile 设计","MIT；体系较大，不适合为 MVP 整体引入"],["Codeman","tmux 持久化；手机 xterm；触控快捷栏；短效单次 QR；设备撤销","移动终端细节、扫码体验、session detach/attach；其 QR 方案可作参考但应提高到高熵 fragment + 终端确认","MIT；其 6 字符短码与 Basic Auth 不应原样成为 Linco 的高权限默认"],["code-server","浏览器 IDE、WebSocket、PWA/iPad 指引、localhost 默认、安全暴露指南、端口代理","验证“远程 Linux 服务 + 浏览器 UI + PWA”长期可用；参考反向代理与 WebSocket 运维","通用 IDE 过重，不能替代 Linco 的 agent/preview 工作流"],["ttyd / WeTTY","xterm.js + WebSocket + PTY；TLS/认证；浏览器终端","终端二进制帧、resize、断连处理与代理配置","只解决终端，不解决文件/预览/任务；不可把 Basic Auth 当完整设备安全"],["Tailscale Serve","把 localhost 服务安全代理到 tailnet HTTPS；ACL；稳定 MagicDNS；身份头","v1 默认远程通道；免公网端口、证书和自建 relay","手机与服务器都需加入 tailnet；应用仍需自己的设备授权"],["OpenVSCode Server","远程 Linux 启动 server，任何现代浏览器访问；connection token","独立二进制、静态前端、连接 token 与部署包形态","桌面 IDE 小屏体验重；token URL 不应长期保留在历史记录"]]},
  {"type":"html","html":"<div class='card'><h3>一手资料链接</h3><ul><li><a href='https://github.com/tiann/hapi/blob/main/docs/guide/how-it-works.md' target='_blank' rel='noopener'>HAPI · How it Works</a> 与 <a href='https://github.com/tiann/hapi/blob/main/docs/guide/installation.md' target='_blank' rel='noopener'>remote/relay/Tailscale installation</a></li><li><a href='https://github.com/happier-dev/happier' target='_blank' rel='noopener'>Happier · daemon/relay/UI architecture</a></li><li><a href='https://github.com/Ark0N/Codeman/blob/master/docs/qr-auth-plan.md' target='_blank' rel='noopener'>Codeman · QR auth design</a></li><li><a href='https://github.com/coder/code-server/blob/main/docs/guide.md' target='_blank' rel='noopener'>code-server · secure exposure guide</a> 与 <a href='https://github.com/coder/code-server/blob/main/docs/ipad.md' target='_blank' rel='noopener'>iPad/PWA guide</a></li><li><a href='https://github.com/tsl0922/ttyd' target='_blank' rel='noopener'>ttyd</a>、<a href='https://github.com/butlerx/wetty' target='_blank' rel='noopener'>WeTTY</a>、<a href='https://github.com/gitpod-io/openvscode-server' target='_blank' rel='noopener'>OpenVSCode Server</a></li><li><a href='https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/steer-remotely' target='_blank' rel='noopener'>GitHub Copilot CLI remote control</a>：官方也采用本机执行、二维码连接手机、远程 steer，并限制高危 allow-all</li><li><a href='https://tailscale.com/docs/features/tailscale-serve' target='_blank' rel='noopener'>Tailscale Serve official docs</a>、<a href='https://cheatsheetseries.owasp.org/cheatsheets/WebSocket_Security_Cheat_Sheet.html' target='_blank' rel='noopener'>OWASP WebSocket Security</a>、<a href='https://datatracker.ietf.org/doc/html/rfc8628' target='_blank' rel='noopener'>RFC 8628 device authorization</a>、<a href='https://developer.mozilla.org/en-US/docs/Web/URI/Reference/Fragment' target='_blank' rel='noopener'>MDN URL fragment behavior</a></li></ul></div><div class='callout'><div class='callout-h'>许可提醒</div><p>HAPI 与 CloudCLI 属 AGPL 路线，适合学习架构与产品行为；若复制实现并以网络服务提供，通常会带来源码公开义务。Happier、Codeman 等 MIT 项目更适合代码级借鉴，但仍应保留版权与许可文件。正式复用前再逐文件确认许可证。</p></div>"},
  {"type":"html","html":"<h2 id='today'>今天就要用：临时方案</h2><div class='grid col-2'><div class='card'><span class='badge new'>最快</span><h3>在远程 Linux 试 HAPI</h3><p>它已经覆盖扫码、PWA、Codex/Claude、远程 spawn、终端与 workspace browser。官方流程是运行 Hub/relay 与 runner。它可以立刻验证你在手机上的真实操作频率与痛点。</p><pre><code># 以下是第三方 HAPI 的示意命令，不是 Linco 当前命令\nnpx @twsxtd/hapi hub --relay\nnpx @twsxtd/hapi runner start --workspace-root /srv/projects</code></pre><p class='note'>先审阅第三方项目与安装方式，再在非敏感环境试用；它不能提供 Linco 的 Notebook 预览、shadow diff 等全部体验。</p></div><div class='card'><span class='badge info'>稳妥备用</span><h3>Tailscale + code-server</h3><p>如果更重视完整 IDE/文件/终端而非 Linco 工作流，可把 code-server 只绑定 localhost，再用 Tailscale Serve 暴露。手机可用但界面偏桌面化，适合作为 Linco Server 完成前的兜底。</p><p><b>不建议：</b>把当前 Linco 的 preview 或任意本地端口直接 bind 到公网，也不建议用 noVNC 当产品架构。</p></div></div>"},
  {"type":"html","html":"<h2 id='decision'>建议现在锁定的四个产品决策</h2><div class='summary-band'><div><span class='k'>Network</span>Tailscale-first</div><div><span class='k'>Client</span>PWA-first</div><div><span class='k'>Scope</span>single-user first</div><div><span class='k'>Session</span>daemon-owned</div></div><div class='callout rec'><div class='callout-h'>最终建议</div><p><b>立项做 <code>linco-server</code>，不是另起一套“Linux 终端版 UI”。</b> 第一阶段用现有 React 前端加 Web transport，远端 Linux 常驻 Rust daemon，Tailscale 提供私网 HTTPS，终端二维码完成设备配对；先达到手机上的功能等价，再升级结构化对话、推送、原生 App 和公网 E2EE relay。</p><p>这条路线既满足“电脑关机也能在服务器继续实验”，又让桌面 Linco 以后获得更稳定的远端会话，不会留下两套难以同步的产品。</p></div><div class='grid col-3'><div class='card'><h3>第一个代码切片</h3><p>Transport 抽象 + <code>linco-server</code> localhost + terminal/fs/preview 三条端到端链路。</p></div><div class='card'><h3>第一个真实用户测试</h3><p>同一台远程 Linux，手机锁屏/切网/重连，agent 不停、输出不丢、输入不重复。</p></div><div class='card'><h3>第一个安全闸门</h3><p>扫码单次消费、设备撤销、workspace escape 与恶意 preview 四类测试。</p></div></div>"}
]
