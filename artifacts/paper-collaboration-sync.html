    "html": "<div class=\"eyebrow\">LINCO · PAPER WORKSPACE · 10 SEPTEMBER 2026</div><h1>Write together. Sync quietly.</h1><p class=\"lede\">Compatible edits merge automatically. Your manuscript stays readable, your history stays recoverable, and routine synchronization needs no conflict window.</p><div class=\"summary-band\"><div><span class=\"k\">Implementation</span>Built · desktop restart pending</div><div><span class=\"k\">Desktop handoff</span>Updated backend requires reopening</div><div><span class=\"k\">Manuscript</span>Not changed or published by these tests</div></div>"

    "type": "html",
    "html": "<h2>A small example, with an important boundary</h2><div class=\"file-diff\"><div class=\"fd-head\"><span class=\"fd-path\">Synthetic manuscript example</span><span class=\"badge add\">AUTOMATIC</span></div><pre class=\"diff\"><span class=\"dl ctx\">Base:      Batch 4; seed 1.</span><span class=\"dl ctx\">Your edit: Batch 8; seed 1.</span><span class=\"dl ctx\">Overleaf:  Batch 4; seed 2.</span><span class=\"dl add\">Combined:  Batch 8; seed 2.</span></pre></div><p>Different character positions do not always mean compatible meaning: changing <code>cat</code> to <code>bat</code> and <code>car</code> must not silently produce <code>bar</code>. Edits within the same word, number, or LaTeX command are therefore not guessed. This is deterministic text merging, not an AI rewriting your scientific claims.</p>"

    "type": "html",
    "html": "<h2>Recovery and safety</h2><div class=\"grid col-2\"><div class=\"card\"><h3>Saved versions, not a rewritten history</h3><p>Pull and Publish checkpoint saved local files before integration. Divergent histories are joined by a merge commit, not rebased. Pull never pushes. Publish uses a normal push, never a forced one.</p><p>A prepared merge is rechecked against the local head, branch, fetched remote head, and working-tree state before applying. Concurrent changes cause a retry, not an overwrite.</p></div><div class=\"card\"><h3>A manuscript remains a manuscript</h3><p>Unresolved Git markers are never inserted into working manuscript files. Unsupported binary, deletion/modification, unusual file-mode, or text-encoding cases remain pending.</p><p>The editor is protected while synchronization runs and reloads merged content afterwards, including after automatic publishing. A late response from a previous project cannot replace the newly selected project’s editor.</p></div></div>"

    "type": "html",
    "html": "<h2>What this does—and does not—inherit from Overleaf</h2><p>Overleaf’s Git bridge transfers project revisions; it is not the same transport as its shared online editor. Overleaf also documents same-line conflicts in its GitHub synchronization workflow. Linco now handles more compatible text edits automatically, but this change does not implement character-by-character CRDT/OT co-editing or guarantee that contradictory changes can always be reconciled. <a href=\"https://docs.overleaf.com/integrations-and-add-ons/git-integration-and-github-synchronization/git\">Overleaf Git integration</a> · <a href=\"https://docs.overleaf.com/integrations-and-add-ons/git-integration-and-github-synchronization/github-synchronization\">Overleaf synchronization documentation</a>.</p><p>The implementation prepares immutable merge trees using Git’s documented <code>merge-tree --write-tree</code> behavior, which does not modify the index or working tree during preparation. Git 2.38 or later is required; the checked versions were Windows Git 2.47 and remote Git 2.43. <a href=\"https://git-scm.com/docs/git-merge-tree\">Git merge-tree documentation</a>.</p>"
